# docs.fangorn.network: static Docusaurus build served as Worker assets.
name: Deploy docs

on:
  push:
    branches: [main]
    paths: [docs.fangorn.network/**, pnpm-lock.yaml, .github/workflows/deploy-docs.yml]
  workflow_dispatch:

concurrency: deploy-docs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs-fangorn-network build
      # Not wrangler-action: its `npm i wrangler` rewrites pnpm's node_modules and drops workspace deps.
      - working-directory: docs.fangorn.network
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
