# fangorn.network: the site (dist/) and its Worker (worker/: /api, /mcp, the registry indexer cron) ship as one Worker.
name: Deploy site

on:
  push:
    branches: [main]
    paths: [fangorn/**, pnpm-lock.yaml, .github/workflows/deploy-site.yml]
  workflow_dispatch:

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fangorn test
      - run: pnpm --filter fangorn build
        env:
          # Baked into the client at build time. Set under Settings → Secrets and variables → Actions → Variables.
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_ENABLE_ACCOUNT: ${{ vars.VITE_ENABLE_ACCOUNT }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL }}
          VITE_LOG_WINDOW: ${{ vars.VITE_LOG_WINDOW }}
          VITE_USDC_ADDRESS: ${{ vars.VITE_USDC_ADDRESS }}
      # Not wrangler-action: its `npm i wrangler` rewrites pnpm's node_modules and drops workspace deps.
      - working-directory: fangorn
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
